name: Complete card on CBS

# The browser cannot POST GrokBot's webhook directly: its server answers the
# CORS preflight and will not allow the Pages origin. Forwarding here also
# keeps the webhook token out of the public JS bundle.
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Card JSON to forward to GrokBot
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: complete-card
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      # PAYLOAD stays in the environment rather than being interpolated into
      # the script, since anyone holding the dispatch token can set it.
      - name: Forward card to GrokBot
        env:
          WEBHOOK_URL: ${{ secrets.GROKBOT_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.GROKBOT_WEBHOOK_TOKEN }}
          PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_URL:-}" ] || [ -z "${WEBHOOK_TOKEN:-}" ]; then
            echo "Add GROKBOT_WEBHOOK_URL and GROKBOT_WEBHOOK_TOKEN secrets."
            exit 1
          fi

          printf '%s' "$PAYLOAD" | jq empty
          week=$(printf '%s' "$PAYLOAD" | jq -r '.week')
          count=$(printf '%s' "$PAYLOAD" | jq '.picks | length')
          flips=$(printf '%s' "$PAYLOAD" | jq '[.picks[] | select(.deviate == true)] | length')
          echo "Forwarding week $week with $count picks ($flips deviations)."

          status=$(printf '%s' "$PAYLOAD" | curl -sS \
            -o /tmp/grokbot-response.txt -w '%{http_code}' \
            -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $WEBHOOK_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @-)

          echo "GrokBot responded $status."
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat /tmp/grokbot-response.txt
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record deviations and refresh the snapshot
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          node scripts/record-card-overrides.mjs
          node --experimental-strip-types --no-warnings=ExperimentalWarning \
            scripts/snapshot-recommendations.ts

      - name: Commit override snapshot
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/card-overrides.json src/data/recommendation-history.json

          if git diff --cached --quiet; then
            echo "Card overrides already match main."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "data: record completed-card deviations"
          git pull --rebase origin main
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy GitHub Pages
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy to GitHub Pages" --ref main
