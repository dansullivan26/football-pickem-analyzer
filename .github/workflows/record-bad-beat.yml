name: Record bad beat

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Add or remove a display-only bad-beat stamp
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: record-bad-beat
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update bad-beats.json
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD" | jq empty
          node --experimental-strip-types --no-warnings=ExperimentalWarning \
            scripts/record-bad-beat.mjs

      - name: Commit bad beats
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/bad-beats.json

          if git diff --cached --quiet; then
            echo "Bad beats already match main."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "data: record a bad beat"
          git pull --rebase origin main
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy GitHub Pages
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy to GitHub Pages" --ref main
