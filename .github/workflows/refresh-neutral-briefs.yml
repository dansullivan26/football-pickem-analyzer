name: Refresh Gemini notes

on:
  schedule:
    # Game-day only. Leftovers first, then recs missing a same-day note.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      ask_all:
        description: Ask every game-day game this run (still ET-day gated)
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: gemini-notes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Snapshot game-day scout notes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.ask_all }}" = "true" ]; then
            npm run snapshot-neutral-briefs -- --all
          else
            npm run snapshot-neutral-briefs
          fi
        env:
          SCOUT_PROVIDER: ${{ vars.SCOUT_PROVIDER }}
          SCOUT_MODEL: ${{ vars.SCOUT_MODEL }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      - name: Commit scout notes
        id: commit
        run: |
          if git diff --quiet -- src/data/neutral-briefs.json; then
            echo "No scout-note changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/neutral-briefs.json
          git commit -m "data: refresh scout notes"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy GitHub Pages
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy to GitHub Pages" --ref "${GITHUB_REF_NAME}"
