name: Refresh sportsbook lines

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-odds
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch DraftKings and FanDuel spreads
        run: node scripts/fetch-odds.mjs
        env:
          SHARP_API_KEY: ${{ secrets.SHARP_API_KEY }}
      - name: Commit changed lines
        run: |
          if git diff --quiet -- public/data/odds.json; then
            echo "No odds changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/odds.json
          git commit -m "data: refresh sportsbook lines"
          git push
