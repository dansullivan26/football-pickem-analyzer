name: Refresh sportsbook lines

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      debug_event_id:
        description: 'cbsEventId to dump raw provider rows for'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch DraftKings spreads
        run: node scripts/fetch-odds.mjs
        env:
          SHARP_API_KEY: ${{ secrets.SHARP_API_KEY }}
          DEBUG_EVENT_ID: ${{ inputs.debug_event_id }}
      - name: Freeze open recommendations
        run: node scripts/snapshot-recommendations.mjs
      - name: Commit changed lines
        run: |
          if git diff --quiet -- public/data/odds.json src/data/recommendation-history.json; then
            echo "No odds or recommendation snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/odds.json src/data/recommendation-history.json
          git commit -m "data: refresh sportsbook lines"
          git push
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
